
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AfterHours</title>
    <link rel="icon" type="image/png" href="images/favicon.png">

    <link rel="stylesheet" href="homepage.css">

    <style>
        .promo-page {
            min-height: 70vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px 20px;
        }

        .promo-page img {
            width: 110px;
            margin-bottom: 20px;
        }

        .promo-page h1 {
            font-size: 1.8rem;
            margin-bottom: 12px;
        }

        .promo-page p {
            color: #777;
            line-height: 1.6;
            max-width: 350px;
        }

        .back-home {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 25px;
            background: #e9a6d1;
            color: white;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
        }
    </style>

</head>

<body>

    <div class="app-container">

        <header>

            <a class="brand-logo" href="homepage.html">
                <img src="images/afterhours-logo.png"
                     alt="AfterHours">
            </a>

        </header>

        <main class="promo-page">

            <img src="images/promo-ticket.png"
                 alt="Promo">

            <h1>Yahh, belum ada promo saat ini :(</h1>

            <p>
                Saat ini belum ada promo yang tersedia.
                Jangan lupa kunjungi AfterHours lagi
                untuk melihat promo terbaru!
            </p>

            <a href="homepage.html" class="back-home">

            </a>
