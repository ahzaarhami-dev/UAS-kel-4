<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AfterHours</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
</head>

<body>

    <div class="app">

        <header>

            <div class="logo">
                AfterHOURS
            </div>

            <button id="menuBtn">
                ☰
            </button>

        </header>

        <div id="drawer">

            <button>Filter</button>
            <button>Tentang</button>

        </div>

        <section class="hero">

            <h1>Temukan Kafe Favoritmu!</h1>

            <p>
                Temukan kafe 24 jam terbaik untuk nongkrong,
                nugas, atau sekadar me time.
            </p>

            <div class="swiper">

                <div class="swiper-wrapper">

                    <div class="swiper-slide">
                        <img src="https://images.unsplash.com/photo-1554118811-1e0d58224f24?w=1200">
                    </div>

                    <div class="swiper-slide">
                        <img src="https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=1200">
                    </div>

                    <div class="swiper-slide">
                        <img src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=1200">
                    </div>

                </div>

                <div class="swiper-pagination"></div>

            </div>

        </section>

        <section class="search-area">

            <div class="search-box">

                <span>🔍</span>

                <input
                    id="searchInput"
                    type="text"
                    placeholder="Cari Cafe">

            </div>

        </section>

        <main class="content">

            <div class="card" id="rekomBtn">

                <div>

                    <h2>Rekomendasi Kami</h2>

                    <p>
                        Berikut ini kafe-kafe terbaik
                        yang harus kamu datangi.
                    </p>

                </div>

                <div class="emoji">
                    ☕
                </div>

            </div>

            <div class="promo">

                <div>

                    <h2>Promo</h2>

                    <p>
                        Promo spesial buat kamu yang
                        mau hemat.
                    </p>

                </div>

                <div class="emoji">
                    🎟️
                </div>

            </div>

        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script src="app.js"></script>

</body>

</html>
